name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""

          # Start cloudflared and redirect BOTH stdout and stderr to a log file
          Start-Process -FilePath "cloudflared" `
            -ArgumentList "tunnel --url tcp://localhost:3389" `
            -RedirectStandardOutput "$env:TEMP\cf_out.log" `
            -RedirectStandardError  "$env:TEMP\cf_err.log" `
            -NoNewWindow

          # Wait for the tunnel URL to appear (up to 60 seconds)
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $content = ""
            if (Test-Path "$env:TEMP\cf_out.log") { $content += Get-Content "$env:TEMP\cf_out.log" -Raw }
            if (Test-Path "$env:TEMP\cf_err.log") { $content += Get-Content "$env:TEMP\cf_err.log" -Raw }
            $match = [regex]::Match($content, 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com')
            if ($match.Success) {
              $url = $match.Value
              break
            }
          }

          Write-Host ""
          if ($url) {
            Write-Host "✅ TUNNEL STARTED!"
            Write-Host ""
            Write-Host "============================================"
            Write-Host "🔗 YOUR TUNNEL URL:"
            Write-Host "   $url"
            Write-Host ""
            Write-Host "📋 CONNECTION DETAILS:"
            Write-Host "   USERNAME: runneradmin"
            Write-Host "   PASSWORD: P@ssw0rd123!"
            Write-Host "   OS: Windows Server 2022"
            Write-Host "   CPU: 4 cores"
            Write-Host "   RAM: 16GB"
            Write-Host "============================================"
          } else {
            Write-Host "❌ Could not detect tunnel URL. Dumping logs:"
            Write-Host "--- STDOUT ---"
            if (Test-Path "$env:TEMP\cf_out.log") { Get-Content "$env:TEMP\cf_out.log" }
            Write-Host "--- STDERR ---"
            if (Test-Path "$env:TEMP\cf_err.log") { Get-Content "$env:TEMP\cf_err.log" }
          }

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
